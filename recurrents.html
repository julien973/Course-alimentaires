
<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes récurrents — Anniversaires & actualisation</title>
<style>
  :root{
    --paper:#f6efe2; --paper2:#efe5d2; --card:#fffaf0;
    --ink:#3a2f26; --ink-soft:#7a6a58; --line:#d9c9ae;
    --accent:#5a7d4a; --accent-soft:#d4e0c8; --past:#b3a48e;
    --shadow:0 2px 10px rgba(90,60,30,.12);
  }
  body.night{
    --paper:#171310; --paper2:#211b15; --card:#28211a;
    --ink:#f0e4d0; --ink-soft:#b8a68c; --line:#4a3c2c;
    --accent:#a8c088; --accent-soft:#3c4a2e; --past:#6e6050;
    --shadow:0 2px 12px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100svh}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:linear-gradient(var(--paper),var(--paper2));
    color:var(--ink);padding-bottom:96px;
    transition:background .3s,color .3s;
  }
  .topbar{
    position:sticky;top:0;z-index:50;background:var(--card);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow);
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand{font-size:1.15rem;font-weight:bold;letter-spacing:.03em}
  .brand .dot{color:var(--accent)}
  .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:.9rem;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .2s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.active{border-color:var(--accent);color:var(--accent);font-weight:bold}
  main{max-width:760px;margin:0 auto;padding:24px 16px}
  .page-title{text-align:center;font-size:1.6rem;margin-bottom:6px}
  .page-sub{text-align:center;color:var(--ink-soft);font-style:italic;margin-bottom:26px;font-size:.95rem}
  .section{margin-bottom:30px}
  .section-title{
    display:flex;align-items:center;gap:10px;font-size:1.05rem;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .rec{
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  }
  .rec-date{
    flex-shrink:0;text-align:center;background:var(--paper2);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:64px;
  }
  .rec-date .d{font-size:1.4rem;font-weight:bold;line-height:1.1;color:var(--accent)}
  .rec-date .m{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .rec-body{flex:1;min-width:0}
  .rec-title{font-size:1.05rem;font-weight:bold;margin-bottom:3px}
  .rec-where{font-size:.85rem;color:var(--ink-soft);font-style:italic}
  .rec-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.8rem}
  .badge{border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--ink-soft)}
  .badge.soon{border-color:var(--accent);color:var(--accent);font-weight:bold;background:var(--accent-soft)}
  .botbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(90,60,30,.10);
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .botbar .brand{font-size:.85rem}
  .botbar .ver{font-size:.8rem;color:var(--ink-soft)}
  .botbar a{color:var(--accent);text-decoration:none;font-size:.8rem;font-weight:bold}
  @media print{.topbar,.botbar{display:none!important}body{padding-bottom:0;background:#fff;color:#000}}
</style>
</head>
<body class="day">

<header class="topbar">
  <div class="brand" data-fr="🗓️ Mes récurrents" data-en="🗓️ My Recurring Events">🗓️ Mes récurrents</div>
  <div class="top-actions">
    <button class="btn" id="lang-fr">🇫🇷 <span>Français</span></button>
    <button class="btn" id="lang-en">🇬🇧 <span>English</span></button>
    <button class="btn" id="theme-btn">☀️ <span data-fr="Thème jour" data-en="Day theme">Thème jour</span></button>
  </div>
</header>

<main>
  <h1 class="page-title" data-fr="Ce qui revient chaque année" data-en="What comes back every year">Ce qui revient chaque année</h1>
  <p class="page-sub" data-fr="Anniversaires et échéances administratives récurrentes — pas des rendez-vous." data-en="Birthdays and recurring admin deadlines — not appointments.">Anniversaires et échéances administratives récurrentes — pas des rendez-vous.</p>

  <div id="app"></div>
</main>

<footer class="botbar">
  <span class="brand" data-fr="🗓️ Récurrents de Julien" data-en="🗓️ Julien's Recurring Events">🗓️ Récurrents de Julien</span>
  <a href="rdv.html" data-fr="→ Mes RDV importants" data-en="→ My important appointments">→ Mes RDV importants</a>
  <span class="ver">v1.0 · 2026</span>
</footer>

<script>
(function(){
  "use strict";

  /* ===== Anniversaires : reviennent chaque année, le même jour ===== */
  var BIRTHDAYS = [
    { day:26, month:9,  fr:"Anniversaire de Sébastien 🎂", en:"Sébastien's birthday 🎂" },
    { day:12, month:10, fr:"Anniversaire de Niva 🎂",      en:"Niva's birthday 🎂" }
  ];

  /* ===== Actualisation RSA : fenêtres mensuelles (ouverture → fermeture) ===== */
  var WINDOWS = [
    { label:"septembre", labelEn:"September",
      open:"2026-09-28", close:"2026-10-15",
      fr:"Actualisation de septembre", en:"September renewal",
      whereFr:"Démarches en ligne — pas un rendez-vous", whereEn:"Online procedure — not an appointment" },
    { label:"octobre", labelEn:"October",
      open:"2026-10-28", close:"2026-11-15",
      fr:"Actualisation d'octobre", en:"October renewal",
      whereFr:"Démarches en ligne — pas un rendez-vous", whereEn:"Online procedure — not an appointment" }
  ];

  var MOIS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var lang = localStorage.getItem("rec-lang") || "fr";
  var theme = localStorage.getItem("rec-theme") || "day";
  var app = document.getElementById("app");

  function dayDiff(y,m,d){
    var today = new Date(); today.setHours(0,0,0,0);
    var t = new Date(y, m-1, d);
    return Math.round((t - today) / 86400000);
  }
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function countBadge(diff, fr){
    if (diff === 0) return '<span class="badge soon">🔥 ' + (fr ? "Aujourd'hui !" : "Today!") + "</span>";
    if (diff === 1) return '<span class="badge soon">⏳ ' + (fr ? "Demain" : "Tomorrow") + "</span>";
    return '<span class="badge">⏳ ' + (fr ? "Dans " + diff + " jours" : "In " + diff + " days") + "</span>";
  }

  function render(){
    var fr = lang === "fr";
    var now = new Date();
    var html = "";

    /* --- Anniversaires --- */
    html += '<section class="section">';
    html += '<h2 class="section-title">🎂 ' + esc(fr ? "Anniversaires" : "Birthdays") + "</h2>";
    BIRTHDAYS.forEach(function(b){
      var y = now.getFullYear();
      var diff = dayDiff(y, b.month, b.day);
      var year = y;
      if (diff < 0) { y++; diff = dayDiff(y, b.month, b.day); year = y; }
      html += '<article class="rec">';
      html += '<div class="rec-date"><div class="d">' + b.day + '</div><div class="m">' + (fr ? MOIS_FR[b.month-1] : MONTHS_EN[b.month-1]) + "</div></div>";
      html += '<div class="rec-body">';
      html += '<div class="rec-title">' + esc(fr ? b.fr : b.en) + "</div>";
      html += '<div class="rec-where">🔁 ' + esc(fr ? "Chaque année, le " + b.day + " " + MOIS_FR[b.month-1] : "Every year on " + MONTHS_EN[b.month-1] + " " + b.day) + "</div>";
      html += '<div class="rec-meta">' + countBadge(diff, fr) + "</div>";
      html += "</div></article>";
    });
    html += "</section>";

    /* --- Fenêtres d'actualisation --- */
    html += '<section class="section">';
    html += '<h2 class="section-title">🏛️ ' + esc(fr ? "Actualisation (fenêtres)" : "Renewal (windows)") + "</h2>";
    WINDOWS.forEach(function(w){
      var dOpen = new Date(w.open + "T00:00");
      var dClose = new Date(w.close + "T00:00");
      var today = new Date(); today.setHours(0,0,0,0);
      var diffOpen = Math.round((dOpen - today) / 86400000);
      var diffClose = Math.round((dClose - today) / 86400000);

      var state;
      if (diffOpen > 0) {
        state = '<span class="badge">🔓 ' + esc(fr ? "Ouvre " : "Opens ") + countBadge(diffOpen, fr).replace(/<[^>]*>/g,"") + "</span>";
      } else if (diffClose >= 0) {
        state = '<span class="badge soon">🟢 ' + esc(fr ? "Ouverte — fermeture dans " + diffClose + " j" : "Open — closes in " + diffClose + " d") + "</span>";
      } else {
        state = '<span class="badge">✓ ' + esc(fr ? "Terminée" : "Completed") + "</span>";
      }

      html += '<article class="rec">';
      html += '<div class="rec-date"><div class="d">' + dOpen.getDate() + '</div><div class="m">' + (fr ? MOIS_FR[dOpen.getMonth()] : MONTHS_EN[dOpen.getMonth()]) + "</div></div>";
      html += '<div class="rec-body">';
      html += '<div class="rec-title">' + esc(fr ? w.fr : w.en) + "</div>";
      html += '<div class="rec-where">📍 ' + esc(fr ? w.whereFr : w.whereEn) + "</div>";
      html += '<div class="rec-meta"><span class="badge">🔓 ' + dOpen.getDate() + " " + (fr ? MOIS_FR[dOpen.getMonth()] : MONTHS_EN[dOpen.getMonth()]) +
              ' → 🔒 ' + dClose.getDate() + " " + (fr ? MOIS_FR[dClose.getMonth()] : MONTHS_EN[dClose.getMonth()]) + "</span>" + state + "</div>";
      html += "</div></article>";
    });
    html += "</section>";

    app.innerHTML = html;
  }

  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-fr]").forEach(function(el){
      el.textContent = lang === "fr" ? el.getAttribute("data-fr") : el.getAttribute("data-en");
    });
    document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    render();
  }
  document.getElementById("lang-fr").addEventListener("click", function(){ lang="fr"; localStorage.setItem("rec-lang",lang); applyLang(); });
  document.getElementById("lang-en").addEventListener("click", function(){ lang="en"; localStorage.setItem("rec-lang",lang); applyLang(); });

  function applyTheme(){
    document.body.className = theme;
    var b = document.getElementById("theme-btn");
    b.innerHTML = theme === "day"
      ? '☀️ <span data-fr="Thème jour" data-en="Day theme">Thème jour</span>'
      : '🌙 <span data-fr="Thème nuit" data-en="Night theme">Thème nuit</span>';
    applyLang();
  }
  document.getElementById("theme-btn").addEventListener("click", function(){
    theme = theme === "day" ? "night" : "day";
    localStorage.setItem("rec-theme", theme);
    applyTheme();
  });

  applyTheme();
})();
</script>
</body>
</html>
