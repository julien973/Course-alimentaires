
<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes RDV importants</title>
<style>
  :root{
    --paper:#f6efe2;
    --paper2:#efe5d2;
    --card:#fffaf0;
    --ink:#3a2f26;
    --ink-soft:#7a6a58;
    --line:#d9c9ae;
    --accent:#c05a2e;
    --accent-soft:#e8cbb8;
    --ok:#5a7d4a;
    --past:#b3a48e;
    --shadow:0 2px 10px rgba(90,60,30,.12);
  }
  body.night{
    --paper:#171310;
    --paper2:#211b15;
    --card:#28211a;
    --ink:#f0e4d0;
    --ink-soft:#b8a68c;
    --line:#4a3c2c;
    --accent:#e8a44c;
    --accent-soft:#5c4326;
    --ok:#a8c088;
    --past:#6e6050;
    --shadow:0 2px 12px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100svh}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--paper);
    background-image:linear-gradient(var(--paper),var(--paper2));
    color:var(--ink);
    padding-bottom:96px;
    transition:background .3s,color .3s;
  }
  /* ---- Topbar ---- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--card);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;
  }
  .brand{font-size:1.15rem;font-weight:bold;letter-spacing:.03em}
  .brand .dot{color:var(--accent)}
  .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:.9rem;
    background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .2s,background .2s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.active{border-color:var(--accent);color:var(--accent);font-weight:bold}
  /* ---- Layout ---- */
  main{max-width:760px;margin:0 auto;padding:24px 16px}
  .page-title{
    text-align:center;font-size:1.6rem;margin-bottom:6px;
  }
  .page-sub{
    text-align:center;color:var(--ink-soft);
    font-style:italic;margin-bottom:26px;font-size:.95rem;
  }
  .stats{
    display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:28px;
  }
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 18px;text-align:center;box-shadow:var(--shadow);min-width:110px;
  }
  .stat b{display:block;font-size:1.35rem;color:var(--accent)}
  .stat span{font-size:.8rem;color:var(--ink-soft)}
  /* ---- Section ---- */
  .section{margin-bottom:30px}
  .section-title{
    display:flex;align-items:center;gap:10px;
    font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:12px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}
  /* ---- Carte RDV ---- */
  .rdv{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    display:flex;gap:14px;align-items:flex-start;
    position:relative;
  }
  .rdv.past{opacity:.45;border-left-color:var(--past)}
  .rdv-date{
    flex-shrink:0;text-align:center;
    background:var(--paper2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;min-width:64px;
  }
  .rdv-date .d{font-size:1.4rem;font-weight:bold;line-height:1.1;color:var(--accent)}
  .rdv-date .m{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .rdv-body{flex:1;min-width:0}
  .rdv-title{font-size:1.05rem;font-weight:bold;margin-bottom:3px}
  .rdv-where{font-size:.85rem;color:var(--ink-soft);font-style:italic}
  .rdv-meta{
    display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;
    font-size:.8rem;align-items:center;
  }
  .badge{
    border:1px solid var(--line);border-radius:20px;
    padding:3px 10px;color:var(--ink-soft);
  }
  .badge.time b{color:var(--accent)}
  .badge.soon{border-color:var(--accent);color:var(--accent);font-weight:bold;background:var(--accent-soft)}
  .badge.done{color:var(--past)}
  /* ---- Botbar ---- */
  .botbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--card);
    border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(90,60,30,.10);
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .botbar .brand{font-size:.85rem}
  .botbar .ver{font-size:.8rem;color:var(--ink-soft)}
  @media print{
    .topbar,.botbar,.top-actions{display:none!important}
    body{padding-bottom:0;background:#fff;color:#000}
  }
  @media (max-width:480px){
    .rdv{flex-direction:column}
    .rdv-date{align-self:flex-start}
  }
</style>
</head>
<body class="day">

<header class="topbar">
  <div class="brand" data-fr="📘 Mes RDV importants" data-en="📘 My Important Appointments">📘 Mes RDV importants</div>
  <div class="top-actions">
    <button class="btn" id="lang-fr">🇫🇷 <span>Français</span></button>
    <button class="btn" id="lang-en">🇬🇧 <span>English</span></button>
    <button class="btn" id="theme-btn">☀️ <span data-fr="Thème jour" data-en="Day theme">Thème jour</span></button>
  </div>
</header>

<main>
  <h1 class="page-title" data-fr="Mon agenda des rendez-vous" data-en="My appointment diary">Mon agenda des rendez-vous</h1>
  <p class="page-sub" data-fr="Les rendez-vous importants, rien d'autre." data-en="The important appointments, nothing else.">Les rendez-vous importants, rien d'autre.</p>

  <div class="stats">
    <div class="stat"><b id="stat-upcoming">0</b><span data-fr="à venir" data-en="upcoming">à venir</span></div>
    <div class="stat"><b id="stat-next">—</b><span data-fr="prochain dans" data-en="next in">prochain dans</span></div>
    <div class="stat"><b id="stat-past">0</b><span data-fr="passés" data-en="past">passés</span></div>
  </div>

  <div id="app"></div>
</main>

<footer class="botbar">
  <span class="brand" data-fr="📘 Agenda de Julien" data-en="📘 Julien's Diary">📘 Agenda de Julien</span>
  <span class="ver">v1.0 · 2026</span>
</footer>

<script>
(function(){
  "use strict";

  /* ===== Données : RDV importants (extrait du calendrier Google, 21/09/2026 → 01/06/2027) ===== */
  var EVENTS = [
    { cat:"sante",   start:"2026-09-22T10:00", end:null,
      fr:"Appeler le cabinet du Dr Poulaliou (dermatologue)", en:"Call Dr Poulaliou's office (dermatologist)",
      whereFr:"Appel téléphonique", whereEn:"Phone call" },
    { cat:"travail", start:"2026-09-22T17:50", end:"2026-09-22T23:00",
      fr:"Mission inventaire — Carrefour Paimpol", en:"Inventory mission — Carrefour Paimpol",
      whereFr:"B2 Parking Agence, 11 Rue Alexis Clairaut, Brest", whereEn:"B2 Parking Agence, 11 Rue Alexis Clairaut, Brest" },
    { cat:"admin",   start:"2026-09-23T15:00", end:"2026-09-23T16:00",
      fr:"Entretien RSA — bilan fin CEU", en:"RSA interview — end-of-CEU review",
      whereFr:"CDAS Bellevue, 13 Napoléon III, Brest", whereEn:"CDAS Bellevue, 13 Napoléon III, Brest" },
    { cat:"famille", start:"2026-09-26", end:null, allday:true,
      fr:"Anniversaire de Sébastien 🎂", en:"Sébastien's birthday 🎂", whereFr:"", whereEn:"" },
    { cat:"admin",   start:"2026-09-28", end:null, allday:true,
      fr:"Ouverture de l'actualisation de septembre", en:"September renewal period opens",
      whereFr:"Démarches en ligne", whereEn:"Online procedure" },
    { cat:"travail", start:"2026-09-28T20:00", end:"2026-09-29T01:00",
      fr:"Mission inventaire — Leclerc Infomil", en:"Inventory mission — Leclerc Infomil",
      whereFr:"Route du Leck, Landerneau", whereEn:"Route du Leck, Landerneau" },
    { cat:"travail", start:"2026-10-09T20:30", end:"2026-10-10T01:30",
      fr:"Mission inventaire — Carrefour Plouzané", en:"Inventory mission — Carrefour Plouzané",
      whereFr:"12 Rue des Myosotis, Plouzané", whereEn:"12 Rue des Myosotis, Plouzané" },
    { cat:"famille", start:"2026-10-12", end:null, allday:true,
      fr:"Anniversaire de Niva 🎂", en:"Niva's birthday 🎂", whereFr:"", whereEn:"" },
    { cat:"admin",   start:"2026-10-15", end:null, allday:true,
      fr:"Fermeture de l'actualisation de septembre", en:"September renewal period closes",
      whereFr:"Démarches en ligne", whereEn:"Online procedure" },
    { cat:"admin",   start:"2026-10-28", end:null, allday:true,
      fr:"Ouverture de l'actualisation d'octobre", en:"October renewal period opens",
      whereFr:"Démarches en ligne", whereEn:"Online procedure" }
  ];

  var CATS = [
    { id:"sante",   icon:"📞", fr:"Santé",        en:"Health" },
    { id:"travail", icon:"🏢", fr:"Travail",      en:"Work" },
    { id:"admin",   icon:"🏛️", fr:"Administratif", en:"Admin" },
    { id:"famille", icon:"🎂", fr:"Famille",      en:"Family" }
  ];

  var MOIS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var JOURS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var DAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  /* ===== État ===== */
  var lang = localStorage.getItem("rdv-lang") || "fr";
  var theme = localStorage.getItem("rdv-theme") || "day";
  var app = document.getElementById("app");

  /* ===== Utilitaires ===== */
  function parse(d){ return new Date(d + (d.length === 10 ? "T00:00" : "")); }
  function dayDiff(d){
    var today = new Date(); today.setHours(0,0,0,0);
    var target = new Date(d); target.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }
  function fmtTime(d){
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" : "") + h + "h" + (m < 10 ? "0" : "") + m;
  }

  /* ===== Rendu ===== */
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function render(){
    var fr = lang === "fr";
    var html = "";
    var upcoming = 0, past = 0, nextDays = null;

    EVENTS.forEach(function(e){ if (dayDiff(e.start) >= 0) upcoming++; else past++; });
    EVENTS.forEach(function(e){
      var d = dayDiff(e.start);
      if (d >= 0 && (nextDays === null || d < nextDays)) nextDays = d;
    });

    CATS.forEach(function(cat){
      var list = EVENTS.filter(function(e){ return e.cat === cat.id; })
                        .sort(function(a,b){ return parse(a.start) - parse(b.start); });
      if (!list.length) return;

      html += '<section class="section">';
      html += '<h2 class="section-title">' + cat.icon + " " + esc(fr ? cat.fr : cat.en) + "</h2>";

      list.forEach(function(e){
        var d = parse(e.start);
        var diff = dayDiff(e.start);
        var isPast = diff < 0;

        var day = d.getDate();
        var month = fr ? MOIS_FR[d.getMonth()] : MONTHS_EN[d.getMonth()];
        var fullDate = (fr ? JOURS_FR[d.getDay()] : DAYS_EN[d.getDay()]) + " " + day + " " + month + " " + d.getFullYear();

        var timeBadge = "";
        if (!e.allday) {
          var t = fmtTime(d) + (e.end ? " – " + fmtTime(parse(e.end)) : "");
          timeBadge = '<span class="badge time">🕐 <b>' + t + "</b></span>";
        } else if (fr) {
          timeBadge = '<span class="badge">🌞 <span data-fr="Journée" data-en="All day">Journée</span></span>';
        } else {
          timeBadge = '<span class="badge">🌞 All day</span>';
        }

        var countBadge = "";
        if (isPast) {
          countBadge = '<span class="badge done">✓ ' + (fr ? "Passé" : "Past") + "</span>";
        } else if (diff === 0) {
          countBadge = '<span class="badge soon">🔥 ' + (fr ? "Aujourd'hui !" : "Today!") + "</span>";
        } else if (diff === 1) {
          countBadge = '<span class="badge soon">⏳ ' + (fr ? "Demain" : "Tomorrow") + "</span>";
        } else {
          countBadge = '<span class="badge">⏳ ' + (fr ? "Dans " + diff + " jours" : "In " + diff + " days") + "</span>";
        }

        var where = (fr ? e.whereFr : e.whereEn) || "";
        var title = esc(fr ? e.fr : e.en);

        html += '<article class="rdv' + (isPast ? " past" : "") + '">';
        html += '<div class="rdv-date"><div class="d">' + day + '</div><div class="m">' + month + "</div></div>";
        html += '<div class="rdv-body">';
        html += '<div class="rdv-title">' + title + "</div>";
        if (where) html += '<div class="rdv-where">📍 ' + esc(where) + "</div>";
        html += '<div class="rdv-meta">' + timeBadge + countBadge + '<span class="badge">📅 ' + fullDate + "</span></div>";
        html += "</div></article>";
      });

      html += "</section>";
    });

    app.innerHTML = html;
    document.getElementById("stat-upcoming").textContent = upcoming;
    document.getElementById("stat-past").textContent = past;
    var nd = document.getElementById("stat-next");
    if (nextDays === null) { nd.textContent = "—"; }
    else if (nextDays === 0) { nd.textContent = lang === "fr" ? "0 j" : "0 d"; }
    else { nd.textContent = (lang === "fr" ? nextDays + " j" : nextDays + " d"); }
  }

  /* ===== Langue ===== */
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-fr]").forEach(function(el){
      el.textContent = lang === "fr" ? el.getAttribute("data-fr") : el.getAttribute("data-en");
    });
    document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    render();
  }
  document.getElementById("lang-fr").addEventListener("click", function(){
    lang = "fr"; localStorage.setItem("rdv-lang", lang); applyLang();
  });
  document.getElementById("lang-en").addEventListener("click", function(){
    lang = "en"; localStorage.setItem("rdv-lang", lang); applyLang();
  });

  /* ===== Thème ===== */
  function applyTheme(){
    document.body.className = theme;
    var b = document.getElementById("theme-btn");
    b.innerHTML = theme === "day"
      ? '☀️ <span data-fr="Thème jour" data-en="Day theme">Thème jour</span>'
      : '🌙 <span data-fr="Thème nuit" data-en="Night theme">Thème nuit</span>';
    applyLang(); // réapplique data-fr après réécriture du bouton
  }
  document.getElementById("theme-btn").addEventListener("click", function(){
    theme = theme === "day" ? "night" : "day";
    localStorage.setItem("rdv-theme", theme);
    applyTheme();
  });

  applyTheme();
})();
</script>
</body>
</html>
